<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link rel="stylesheet" href="ResetThePass.css">
</head>
<body>

<div class="container">

    <div class="image">
        <img src="Picture/Reset.jpg" alt="Stack of library books">
    </div>

    <div class="text" id = 'text'>
        <h2>Reset Password</h2>
        <p>We 'll email you a link to reset your Password.</p>
        <form action="Login.html" method="post" id="resetPassForm">

            <input type="email" placeholder="✉ Email" name="email" required id="email">
            <p id="message"></p>
            <button type="submit">Send an email</button>
        </form>

        <a href="Login.html">  Go back to Login</a>
    </div>

</div>
<script src="ResetThePass.js"></script>
</body>
</html>
