<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <title>Add new book</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'add.css' %}">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="/adminhome/">
                    <img src="{% static 'Picture/ddfgd.png' %}" alt="logo">
                </a>
            </div>
            <div class="nav-links">
                <a href="/add/" class="active">Add book</a>
                <a href="/admindashboard/">Admin Dashboard</a>
                <a href="/available_book_admin/">Browse Books</a>
                <a href="/login/">Log out</a>
            </div>
        </nav>
    </header>

    <div class="add-book-card">
        <h2>Add New Book</h2>
        <a href="/admindashboard/" class="btn-back">Back to Dashboard</a>

        <form action="{% url 'add_book' %}" method="POST" enctype="multipart/form-data">            <h3 class="section-title">Info</h3>
            {% csrf_token %} <!--  more security -->

            <div class="input-group">
                <label for="id_b">ID: </label>
                <input id="id_b" type="text" name="id_b" placeholder="#12346..." required>
            </div>
            <div class="input-group">
                <label for="name_b">Name:</label>
                <input id="name_b" type="text" name="name_b" placeholder="ex:Harry Potter..." required>
            </div>
            <div class="input-group">
                <label for="author">Author:</label>
                <input id="author" type="text" name="author" placeholder="ex:Joanne Rowling..." required>
            </div>
            <div class="input-group">
                <label for="aboutAuthor">About Author</label>
                <input id="aboutAuthor" type="url" name="aboutAuthor" placeholder="ex:https://author.com" required>
            </div>
            <div class="input-group">
                <label for="release_date">Release Date:</label>
                <input id="release_date" type="text" name="release_date" placeholder="ex:June 8,2006..." required>
            </div>
            <div class="input-group">
                <label for="written_lan">Written Language:</label>
                <input id="written_lan" type="text" name="written_lan" placeholder="ex:English...">
            </div>
            <div class="input-group">
                <label for="amazonLink">Amazon Link:</label>
                <input id="amazonLink" type="url" name="amazonLink" placeholder="ex:https://amazonLink.com...">
            </div>

            <h3 class="section-title">Categories Section</h3>
            <div class="checkbox-container">
                <div><input id="cat1" type="checkbox" name="category" value="Science Fiction"><label for="cat1">Science Fiction</label></div>
                <div><input id="cat2" type="checkbox" name="category" value="Literary Fiction"><label for="cat2">Literary Fiction</label></div>
                <div><input id="cat3" type="checkbox" name="category" value="Historical Fiction"><label for="cat3">Historical Fiction</label></div>
                <div><input id="cat4" type="checkbox" name="category" value="Thriller & Suspense"><label for="cat4">Thriller & Suspense</label></div>
                <div><input id="cat5" type="checkbox" name="category" value="Fantasy"><label for="cat5">Fantasy</label></div>
                <div><input id="cat6" type="checkbox" name="category" value="Mystery"><label for="cat6">Mystery</label></div>
                <div><input id="cat7" type="checkbox" name="category" value="Horror"><label for="cat7">Horror</label></div>
                <div><input id="cat8" type="checkbox" name="category" value="Romance"><label for="cat8">Romance</label></div>
                <div><input id="cat9" type="checkbox" name="category" value="Comedy"><label for="cat9">Comedy</label></div>
            </div>

            <h3 class="section-title">Description Section</h3>
            <textarea name="description" placeholder="Write book description here..." required></textarea>

            <h3 class="section-title">Upload The Cover Page</h3>
            <div class="input-group">
                <label for="file">Upload the book cover: </label>
                <input id="file" type="file" name="file" accept="image/*" required>
                <img id="view" src="" alt="Cover view">
            </div>

            <div class="form-actions">
                <input type="submit" value="Add Book" class="btn-submit">
                <input type="Reset" value="Reset" class="btn-reset">
            </div>
        </form>
    </div>

    <br><br><br>

    {% include "footer.html" %}

    <script src="{% static 'add.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    {% if success %}``   <!-- عشان لما الحاجه تتضاف فى الداتا بيز تظهرلى الرساله-->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            Swal.fire({
                title: "Success!",
                text: "The Book has been successfully saved to the Database!",
                icon: "success",
                confirmButtonColor: "#B85C38" 
            });
        });
    </script>
    {% endif %}
</body>
</html>
