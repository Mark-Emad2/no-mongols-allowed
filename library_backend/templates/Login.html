<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body>
<div class="container">
    <div class="text">
        <h2>Sign In</h2>
        <form id="loginForm">
            <div>
                <input type="email" placeholder="Email" name="email" required id="email">
            </div>
            <div>
                <input type="password" placeholder="Password" name="password" required id="password">
            </div>
            <div>
                <a href="/reset/" id="fyourpass">Forgot Your Password?</a>
            </div>
            <p id="message"></p>
            <button type="submit">Log in</button>
            <div class="DHave">
                <p>Don't have an account? <a href="/signup/">Create</a></p>
            </div>
        </form>
    </div>
    <div class="image">
        <img src="{% static 'Picture/loginbooks2.jpg' %}">
    </div>
</div>
<script src="{% static 'Login.js' %}"></script>
</body>
</html>
