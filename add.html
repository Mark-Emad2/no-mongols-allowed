    <h2>Add New Book</h2>
    <button><a href=""></a>Back</button>
    <h3>Info</h3>
    <div>
        <label for="id_b">ID: </label>
        <input id="id_b" type="text" name="id_b" placeholder="#12346..." required>
    </div>

    <br />

    <div>
        <label for="name_b">Name:</label>
        <input id="name_b" type="text" name="name_b" placeholder="ex:Harry Poter..." required>
    </div>

    <br />

    <div>
        <label for="author">Author:</label>
        <input id="author" type="text" name="author" placeholder="ex:Joanne Rowling..." required>
    </div>

    <br />

    <div>
        <label for="release_date">Release Date</label>
        <input id="release_date" type="date" name="release_date">
    </div>

    <br />

    <div>
        <label for="written_lan">Written Language</label>
        <input id="written_lan" type="text" name="written_lan" placeholder="ex:English...">
    </div>

    <br />
    <hr />



    <h3>Categories Section</h3>

    <div>
        <input id="Science_Fiction" type="checkbox" name="category" value="Science_Fiction">
        <label for="Science_Fiction">Science Fiction (Sci-Fi)</label>
    </div>

    <div>
        <input id="Literary_Fiction" type="checkbox" name="category" value="Literary_Fiction">
        <label for="Literary_Fiction">Literary Fiction</label>
    </div>

    <div>
        <input id="Historical_Fiction" type="checkbox" name="category" value="Historical_Fiction">
        <label for="Historical_Fiction">Historical Fiction</label>
    </div>

    <div>
        <input id="Thriller_&_Suspense" type="checkbox" name="category" value="Thriller_&_Suspense">
        <label for="Thriller_&_Suspense">Thriller & Suspense</label>
    </div>

    <div>
        <input id="Fantasy" type="checkbox" name="category" value="Fantasy">
        <label for="Fantasy">Fantasy</label>
    </div>

    <div>
        <input id="Mystery" type="checkbox" name="category" value="Mystery">
        <label for="Mystery">Mystery</label>
    </div>

    <div>
        <input id="Horror" type="checkbox" name="category" value="Horror">
        <label for="Horror">Horror</label>
    </div>

    <div>
        <input id="Romance" type="checkbox" name="category" value="Romance">
        <label for="Romance">Romance</label>
    </div>

    <div>
        <input id="Dystopian" type="checkbox" name="category" value="Dystopian">
        <label for="Dystopian">Dystopian</label>
    </div>

    <div>
        <input id="Comedy" type="checkbox" name="category" value="Comedy">
        <label for="Comedy">Comedy</label>
    </div>

    <div>
        <input id="kids" type="checkbox" name="category" value="kids">
        <label for="kids">kids</label>
    </div>

    <div>
        <input id="Travel" type="checkbox" name="category" value="Travel">
        <label for="Travel">Travel</label>
    </div>

    <div>
        <input id="Business_&_Economics" type="checkbox" name="category" value="Business_&_Economics">
        <label for="Business_&_Economics">Business & Economics</label>
    </div>

    <div>
        <input id="Biography_&_Memoir" type="checkbox" name="category" value="Biography_&_Memoir">
        <label for="Biography_&_Memoir">Biography & Memoir</label>
    </div>

    <div>
        <input id="Science_&_Technology" type="checkbox" name="category" value="Science_&_Technology">
        <label for="Science_&_Technology">Science & Technology</label>
    </div>



    <div>
        <input id="Philosophy_&_Religion" type="checkbox" name="category" value="Philosophy_&_Religion">
        <label for="Philosophy_&_Religion">Philosophy & Religion</label>
    </div>

    <br />
    <hr />
    <h3>Description Section</h3>

    <textarea name="description" cols="40" rows="20" placeholder="...." required></textarea>

    <br />
    <hr />

    <h3>Upload The Cover Page</h3>
    <div>
        <label for="file">Upload the book cover </label>
        <input id="file" type="file" name="file" placeholder="Upload..." required>
    </div>
