<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
<div class="container">
    <h2>Sign In</h2>
    <p>You can log in to your account any time</p>

    <form action="main.html" method="post">
        <div>
            <input type="email" placeholder="Email" required>
        </div>
        <div>
            <input type="password" placeholder="Password" required>
        </div>

        <div>
            <a href="#" class="link-light" id="FURP">Forgot Your Password?</a>
        </div>

        <button class="btn btn-primary" type="submit">Log in</button>

        <div>
            <h4>Don't have an account?</h4>
            <a href="CreateAnAccount.html" class="btn btn-outline">Create</a>
        </div>
    </form>
</div>
</body>
</html>
