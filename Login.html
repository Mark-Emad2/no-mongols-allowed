<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
<div class="container">
    <div class="text">
        <h2>Sign In</h2>

        <form action="main.html" method="post" id="loginForm">

            <div>
                <input type="email" placeholder="Email" name="email" required id="email">
            </div>

            <div>
                <input type="password" placeholder="Password" name="password" required id="password">
            </div>

            <div>
                <a href="ResetThePass.html"  id="fyourpass">Forgot Your Password?</a>
            </div>
            <p id ='message'></p>
            <button  type="submit">Log in</button>

            <div class="DHave">
                <p>Don't have an account? <a href="CAACC.html">Create</a></p>
            </div>
        </form>
    </div>


    <div class="image">
        <img src="Picture/loginbooks2.jpg" alt="Stack of library books">
    </div>

</div>
<script src="Login.js"></script>
</body>
</html>
