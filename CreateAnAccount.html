<!DOCTYPE html>
<html lang="en">
<head>

<body>
<h2> Create An Account </h2>
<p>create an account to convert and send books to other platforms, save to favorites and booklists, and more</p>

<form action="Login.html">
    <input type="email" required placeholder="Email">
    <input type="password" required placeholder="Password" minlength="8" >
    <input type="text"  placeholder="Phone Number">
    <input type="text" required placeholder="Nick Name">

    <input type="radio" id="male" name="gender" value="Ragel">
    <label for="male">Male</label>
    <input type="radio" id="Female" name="gender" value="set">
    <label for="Female">Female</label>

    <p>By registering, you agree to <a href="Terms%20of%20Service">our Terms of Service</a> </p>

    <button type="submit">Create Account</button>
</form>



<p>Already have an account?</p>
<button><a href="Login.html">Log in</a></button>

</body>
