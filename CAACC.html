<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account</title>
    <link rel="stylesheet" href="CAACC.css">
</head>
<body>
<div class="container">
    <div class="image">
        <img src="Picture/loginboks.jfif" alt="Stack of library books">
    </div>

    <div class="text">
        <h2> Sign Up</h2>

        <form id="signupForm" method="POST">
            <input type="text" required placeholder="First Name" name="firstName" id="firstname">
            <input type="text" required placeholder="Last Name" name="lastName">
            <input type="email" required placeholder="Email" name="email" id="email">

            <input type="password" id="password" required placeholder="Password" minlength="8" name="password">
            <input type="password" id="confirmPassword" required placeholder="Confirm Password">

            <div class="admin">
                <input type="checkbox" id="admin" name="admin">
                <label for="admin">Sign Up as Admin</label>
            </div>

            <div id="orgPassContainer" style="display: none; margin-top: 10px;">
                <input type="password" id="orgPassword" placeholder="Organization Password">
            </div>

            <p id="message"></p>

            <div class="checkbox">
                <input type="checkbox" id="TOS" name="TOS" required>
                <label for="TOS">Accept <a href="#">Terms of Service</a></label>
            </div>

            <button type="submit">Create Account</button>
        </form>

        <div class="signin">
            <p>Already have an account? <a href="Login.html">Sign In</a></p>
        </div>
    </div>
</div>

<script src="CAACC.js"></script>
</body>
</html>
