<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create</title>

    <link rel="stylesheet" href="CAACC.css">

<body>
<div class="container">

    <div class="image">
        <img src="Picture/loginboks.jpg" alt="Stack of library books"></img>
        <h3>Create Your Account</h3>

    </div>

    <div class="text">
        <h2> Sign Up</h2>

        <form id="signupForm" action="Login.html" method="POST">
            <input type="text" required placeholder="First Name" name="firstName">
            <input type="text" required placeholder="Last Name" name="lastName">
            <input type="email" required placeholder="Email" name="email">

            <input type="password" id="password" required placeholder="Password" minlength="8" name="password">

            <input type="password" id="confirmPassword" required placeholder="Confirm Password">

            <p id="message"></p> <!-- for JS Message -->

            <div class="checkbox">
                <input type="checkbox" id="TOS" name="TOS" required>
                <label for="TOS">Accept <a href="Terms%20of%20Service">Terms of Service</a></label>
            </div>

            <button type="submit">Create Account</button>
        </form>

        <div class="signin">
            <p>Already have an account? <a href="Login.html">Sign In</a></p>
        </div>

    </div>
</div>
